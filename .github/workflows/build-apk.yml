name: build-apk

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repack-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Install zip tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Download base v0.15 APK, add Android 11 HAL stubs, align, and sign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download --repo ${{ github.repository }} --pattern "prototype.apk" --dir /tmp

          mkdir -p /tmp/apk-unpacked/lib/arm64-v8a
          CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"

          # Create tiny stub libhardware.so exporting hw_get_module (returns -2 ENOENT safely)
          echo 'int hw_get_module(const char *id, const void **module) { return -2; }' > /tmp/hw_stub.c
          "$CC" -shared -fPIC /tmp/hw_stub.c -o /tmp/apk-unpacked/lib/arm64-v8a/libhardware.so

          # Create tiny stub libcutils.so
          echo 'int property_get(const char *key, char *value, const char *default_value) { return 0; }' > /tmp/cutils_stub.c
          "$CC" -shared -fPIC /tmp/cutils_stub.c -o /tmp/apk-unpacked/lib/arm64-v8a/libcutils.so

          cp /tmp/prototype.apk /tmp/patched-unaligned.apk
          cd /tmp/apk-unpacked
          zip -0 /tmp/patched-unaligned.apk lib/arm64-v8a/libhardware.so lib/arm64-v8a/libcutils.so

          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -p -f 4 /tmp/patched-unaligned.apk /tmp/patched-aligned.apk

          keytool -genkey -v -keystore /tmp/ci.keystore -storepass android -alias ci \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ProtoDroid,O=ProtoDroid,C=US"
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/ci.keystore --ks-pass pass:android --key-pass pass:android \
            --out /tmp/prototype-rp3.apk /tmp/patched-aligned.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: prototype-apk
          path: /tmp/prototype-rp3.apk
