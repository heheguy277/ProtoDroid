name: build-apk

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  repack-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Install patchelf and zip tools
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf unzip zip

      - name: Download base v0.15 APK, patch wrapper, align, and sign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download --repo ${{ github.repository }} --pattern "prototype.apk" --dir /tmp

          mkdir -p /tmp/apk-unpacked
          unzip -q /tmp/prototype.apk "lib/arm64-v8a/libvulkan_wrapper.so" -d /tmp/apk-unpacked
          WRAPPER="/tmp/apk-unpacked/lib/arm64-v8a/libvulkan_wrapper.so"

          echo "=== Before patchelf ==="
          patchelf --print-needed "$WRAPPER"

          for lib in $(patchelf --print-needed "$WRAPPER"); do
            case "$lib" in
              libc.so|libm.so|libdl.so|liblog.so|libz.so|libandroid.so|libnativewindow.so|libvulkan.so|libsync.so)
                echo "Keeping public NDK lib: $lib"
                ;;
              *)
                echo "Removing private system lib: $lib"
                patchelf --remove-needed "$lib" "$WRAPPER"
                ;;
            esac
          done

          echo "=== After patchelf ==="
          patchelf --print-needed "$WRAPPER"

          cp /tmp/prototype.apk /tmp/patched-unaligned.apk
          cd /tmp/apk-unpacked
          zip -0 /tmp/patched-unaligned.apk lib/arm64-v8a/libvulkan_wrapper.so

          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -p -f 4 /tmp/patched-unaligned.apk /tmp/patched-aligned.apk

          keytool -genkey -v -keystore /tmp/ci.keystore -storepass android -alias ci \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ProtoDroid,O=ProtoDroid,C=US"
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/ci.keystore --ks-pass pass:android --key-pass pass:android \
            --out /tmp/prototype-rp3.apk /tmp/patched-aligned.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: prototype-apk
          path: /tmp/prototype-rp3.apk
